
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rural Education Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        #chat-container {
            width: 50%;
            margin: 50px auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.2);
            padding: 20px;
        }
        #chatbox {
            width: 100%;
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #ddd;
        }
        #user-input {
            width: 75%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        #send-btn {
            padding: 10px 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #send-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <h1>Rural Education Chatbot</h1>
        <div id="chatbox"></div>
        <input id="user-input" type="text" placeholder="Type your message here...">
        <button id="send-btn">Send</button>
    </div>
    <script>
        document.getElementById("send-btn").addEventListener("click", function() {
            var userInput = document.getElementById("user-input").value;
            document.getElementById("chatbox").innerHTML += "<div><b>You:</b> " + userInput + "</div>";
            document.getElementById("user-input").value = "";

            fetch("/get", {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: "msg=" + userInput
            }).then(response => response.text()).then(data => {
                document.getElementById("chatbox").innerHTML += "<div><b>Bot:</b> " + data + "</div>";
            }).catch(error => {
                document.getElementById("chatbox").innerHTML += "<div><b>Bot:</b> Sorry, there was an error processing your request.</div>";
            });
        });
    </script>
</body>
</html>
